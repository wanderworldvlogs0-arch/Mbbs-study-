services:
  - type: web
    name: medmaster-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medmaster-ai-db
          property: connectionString

databases:
  - name: medmaster-ai-db
    plan: free

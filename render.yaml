services:
  - type: web
    name: medmaster-ai
    runtime: node
    plan: free
    buildCommand: >-
  pnpm install &&
  pnpm --filter @workspace/db run push &&
  pnpm --filter @workspace/db run seed &&
  pnpm --filter @workspace/web run build &&
  pnpm --filter @workspace/api-server run build
startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medmaster-ai-db
          property: connectionString
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_HOME
        value: /opt/render/project/.corepack
      - key: PNPM_VERSION
        value: 10.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: medmaster-ai-db
          property: connectionString

databases:
  - name: medmaster-ai-db
    plan: free

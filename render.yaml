services:
  - type: web
    name: medmaster-ai
    runtime: node
    plan: free
    buildCommand: >-
  npx pnpm@10 install &&
  npx pnpm@10 --filter @workspace/db run push &&
  npx pnpm@10 --filter @workspace/db run seed &&
  npx pnpm@10 --filter @workspace/web run build &&
  npx pnpm@10 --filter @workspace/api-server run build
startCommand: npx pnpm@10 --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medmaster-ai-db
          property: connectionString

databases:
  - name: medmaster-ai-db
    plan: free
